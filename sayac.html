<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Akdeniz sayaç</title>
<style>
:root{--bg:#F4F2EE;--card:#fff;--ink:#1B1F1E;--muted:#6B716F;--line:#E4E0D8}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1C2120;--ink:#ECEFEE;--muted:#9AA3A0;--line:#2A302E}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Roboto,sans-serif;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--muted);margin:0 0 20px;font-size:14px;line-height:1.5}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.c b{display:block;margin-bottom:10px}.c img{height:28px}
</style></head><body>
<h1>Akdeniz · ziyaret sayısı</h1>
<p>Sayım 5 Kasım 2026'dan itibaren. Bu sayfayı açmak sayıyı artırmaz.</p>
<div class="c"><b>Siteye giren telefon (cihaz) sayısı</b><img id="a" alt="yükleniyor"></div>
<div class="c"><b>Toplam açılış</b><img id="b" alt="yükleniyor"></div>
<p>Aynı telefon tarayıcıdan ve ana ekrana eklenmiş uygulamadan ayrı ayrı girerse iki kez sayılabilir.</p>
<script>
var S='https://hits.konst.fish/api/count/show/badge.svg?url=', U='https://eruston.github.io/akdeniz/';
document.getElementById('a').src=S+encodeURIComponent(U+'cihaz')+'&title=cihaz&t='+Date.now();
document.getElementById('b').src=S+encodeURIComponent(U+'acilis')+'&title=a%C3%A7%C4%B1l%C4%B1%C5%9F&t='+Date.now();
['a','b'].forEach(function(id){document.getElementById(id).onerror=function(){this.replaceWith(document.createTextNode('Sayaç servisine ulaşılamadı.'))}});
</script></body></html>
